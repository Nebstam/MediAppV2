<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155e75"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Medikamente"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"><title>Meine Medikamente</title></head><body><div class="app"><header><div><small>MEIN GESUNDHEITSPLAN</small><h1>Meine Medikamente</h1></div><span id="offline" class="pill">Lokal gespeichert</span></header><nav aria-label="Navigation"><button data-view="today" class="active">Heute</button><button data-view="meds">Medikamente</button><button data-view="history">Verlauf</button><button data-view="settings">Daten</button></nav><main id="main"></main><footer>Deine Daten bleiben auf diesem Gerät. Diese App ersetzt keine medizinische Beratung.</footer></div><dialog id="editor"><form id="med-form"><h2 id="editor-title">Medikament</h2><input type="hidden" name="id"><label>Name<input name="name" required maxlength="100" placeholder="z. B. Medikament A"></label><label>Dosierung<input name="dose" required maxlength="100" placeholder="z. B. 1 Tablette / 5 mg"></label><label>Einnahmezeit<input type="time" name="time" required value="08:00"></label><label>Darreichungsform (optional)<select name="form"><option value="">Keine Angabe</option><option>Tablette</option><option>Kapsel</option><option>Pen</option><option>Spritze</option><option>Tropfen</option><option>Saft</option><option>Pflaster</option><option>Inhalator</option><option>Creme / Salbe</option><option value="Andere">Andere</option></select></label><label>Einnahmehäufigkeit<select name="frequency" id="frequency"><option value="daily">Täglich</option><option value="weekly">Wöchentlich (Wochentage wählen)</option><option value="interval">Alle X Tage</option><option value="monthly">Monatlich</option></select></label><div id="weekly-options" class="schedule-options" hidden><span class="field-heading">An welchen Wochentagen?</span><div class="weekdays"><label><input type="checkbox" name="weekday" value="1"> Mo</label><label><input type="checkbox" name="weekday" value="2"> Di</label><label><input type="checkbox" name="weekday" value="3"> Mi</label><label><input type="checkbox" name="weekday" value="4"> Do</label><label><input type="checkbox" name="weekday" value="5"> Fr</label><label><input type="checkbox" name="weekday" value="6"> Sa</label><label><input type="checkbox" name="weekday" value="0"> So</label></div></div><div id="interval-options" class="schedule-options" hidden><label>Abstand in Tagen<input name="intervalDays" type="number" min="2" max="365" value="2" required disabled></label><label>Erste geplante Einnahme<input name="startDate" type="date" required disabled></label></div><div id="monthly-options" class="schedule-options" hidden><label>Tag des Monats<input name="monthDay" type="number" min="1" max="31" value="1" required disabled></label><p class="muted">In Monaten ohne diesen Tag ist keine Einnahme vorgesehen.</p></div><label>Hinweise (optional)<input name="notes" maxlength="250" placeholder="z. B. zum Frühstück"></label><label class="check"><input type="checkbox" name="active" checked>Aktiv</label><div class="actions"><button type="button" class="secondary" id="cancel">Abbrechen</button><button type="submit">Speichern</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
